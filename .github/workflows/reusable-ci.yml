#
# Shared check job for one build group of the tpt-kernel workspace. ci.yml
# calls it once per group, each with its own target and package set.
name: Reusable CI

on:
  workflow_call:
    inputs:
      target:
        description: Cargo target triple for fmt-free steps; empty for the host
        type: string
        default: ""
      packages:
        description: Cargo package selection, e.g. "-p crate-a -p crate-b"
        type: string
        required: true
      run_tests:
        description: Run `cargo test` with test_packages on the host
        type: boolean
        default: false
      test_packages:
        description: Package selection for `cargo test` (host target)
        type: string
        default: ""
      tcb_checks:
        description: No build.rs and no -sys dependencies in the workspace
        type: boolean
        default: false
      nostd_crates:
        description: Directory names under crates/ whose crate roots must declare #![no_std]
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain, components, and targets pinned in rust-toolchain.toml.
      - name: Show pinned toolchain
        run: rustup show

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        env:
          TARGET: ${{ inputs.target }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          target_arg=""; [ -n "$TARGET" ] && target_arg="--target $TARGET"
          cargo clippy $PACKAGES $target_arg -- -D warnings

      - name: Build
        env:
          TARGET: ${{ inputs.target }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          target_arg=""; [ -n "$TARGET" ] && target_arg="--target $TARGET"
          cargo build $PACKAGES $target_arg

      - name: Test
        if: inputs.run_tests
        env:
          TEST_PACKAGES: ${{ inputs.test_packages }}
        run: cargo test $TEST_PACKAGES

      - name: "TCB rules: no build scripts or -sys dependencies"
        if: inputs.tcb_checks
        run: |
          if find crates -name build.rs -print | grep -q .; then
            echo "build.rs is not allowed in TCB crates"; exit 1
          fi
          if grep -rEn '^[A-Za-z0-9_-]+-sys[[:space:]]*=' --include=Cargo.toml crates ; then
            echo "-sys (C binding) dependency is not allowed in TCB crates"; exit 1
          fi
          echo "no build scripts or -sys dependencies"

      - name: no_std declared in each TCB crate root
        if: inputs.nostd_crates != ''
        env:
          NOSTD_CRATES: ${{ inputs.nostd_crates }}
        run: |
          status=0
          for name in $NOSTD_CRATES; do
            root="crates/$name/src/lib.rs"
            [ -f "$root" ] || root="crates/$name/src/main.rs"
            if ! grep -q '^#!\[no_std\]' "$root"; then
              echo "missing #![no_std]: $root"; status=1
            fi
          done
          [ "$status" -eq 0 ] && echo "all TCB crate roots are #![no_std]"
          exit $status

# SPDX-License-Identifier: MIT OR Apache-2.0
name: QEMU smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch sibling tpt-primitives (path dependency)
        run: git clone --depth 1 https://github.com/tpt-solutions/tpt-primitives.git "$GITHUB_WORKSPACE/../tpt-primitives"

      - name: Install QEMU and OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf

      # rust-toolchain.toml pins the toolchain and both bare-metal and UEFI targets;
      # `rustup show` installs them.
      - name: Install pinned toolchain
        run: rustup show

      # The kernel is linked against the bare-metal core library. Install it
      # explicitly, as ci.yml does, so the build does not depend on rustup show.
      - name: Install bare-metal target
        run: rustup target add x86_64-unknown-none x86_64-unknown-uefi

      - name: Boot the kernel in QEMU
        env:
          OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
          OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
        run: bash scripts/qemu-smoke.sh

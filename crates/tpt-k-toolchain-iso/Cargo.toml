[package]
name = "tpt-k-toolchain-iso"
version = "0.0.0"
description = "tpt-k boot image assembly: a FAT32 boot-partition writer and a GPT disk wrapper."
readme = "README.md"
keywords = ["iso", "uefi", "disk-image", "tpt-k", "bootable"]
categories = ["development-tools::build-utils", "os"]
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
# The reader that checks the images, and the 8.3 name rule shared with it.
tpt-k-boot-fs = { path = "../tpt-k-boot-fs" }

[package]
name = "tpt-k-ipc-cap"
version.workspace = true
description = "tpt-k IPC capabilities: tokens, rights, unforgeable handles."
readme = "README.md"
keywords = ["capability", "ipc", "security", "tpt-k", "tokens"]
categories = ["os", "no-std"]
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
# SHA-256 for the token tag. Uses the no_std build with no default features.
tpt-primitives = { path = "../../../tpt-primitives/crates/tpt-primitives", default-features = false }

[dev-dependencies]

[package]
name = "tpt-k-boot"
version = "0.0.0"
description = "tpt-k UEFI bootloader application (scaffold)."
readme = "README.md"
keywords = ["uefi", "bootloader", "tpt-k", "x86-64", "elf"]
categories = ["os", "no-std"]
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
tpt-k-boot-efi = { path = "../tpt-k-boot-efi" }
tpt-k-boot-fs = { path = "../tpt-k-boot-fs" }

[[bin]]
name = "tpt-k-boot"
path = "src/main.rs"
test = false
doc = false

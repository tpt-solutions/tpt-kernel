[package]
name = "tpt-k-root"
version = "0.0.0"
description = "tpt-k root server: capability service over tpt-k-ipc. The kernel handoff is not built yet."
readme = "README.md"
keywords = ["root-server", "capability", "microkernel", "tpt-k", "init"]
categories = ["os"]
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
tpt-k-ipc = { path = "../tpt-k-ipc" }
tpt-k-ipc-cap = { path = "../tpt-k-ipc-cap" }
tpt-k-root-caps = { path = "../tpt-k-root-caps" }

# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "tpt-k-kernel"
version.workspace = true
description = "tpt-k kernel main binary: early boot entry, stack setup, panic handler."
readme = "README.md"
keywords = ["microkernel", "kernel", "x86-64", "tpt-k", "capability"]
categories = ["os", "no-std"]
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
tpt-k-kernel-mem = { path = "../tpt-k-kernel-mem" }
tpt-k-kernel-arch-x86_64 = { path = "../tpt-k-kernel-arch-x86_64" }
tpt-k-kernel-sched = { path = "../tpt-k-kernel-sched" }
tpt-k-kernel-ipc = { path = "../tpt-k-kernel-ipc" }

[[bin]]
name = "tpt-k-kernel"
path = "src/main.rs"
test = false
doc = false

[features]
# Fixed APIC timer period, so the boot transcript is the same on every run under
# the instruction counter. Used by `tpt-k-build replay`; not for real hardware.
replay = []

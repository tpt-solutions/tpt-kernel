#
# Build settings for the workspace.

# x86_64-unknown-none is soft-float with SSE disabled. sha2 0.11 selects its
# SHA-NI backend there, and rustc 1.95.0 aborts compiling it with
# "Do not know how to split the result of this operator!". Select the portable
# soft backend for this target only. Host and UEFI builds keep the default.
[target.x86_64-unknown-none]
rustflags = ["--cfg", 'sha2_backend="soft"']
